view_attributes:
  properties:
    section:
      type: string
      enum:
        - onboarding
        - account

views:
  Login:
    attributes:
      section: onboarding
    tracks:
      - LoginFailed
  Signup:
    attributes:
      section: onboarding
    tracks:
      - LoginFailed
  Settings: {}

tracks:
  LoginFailed:
    properties:
      reason:
        type: string
